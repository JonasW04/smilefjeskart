name: Update tilsyndata

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore geocode cache
        uses: actions/cache@v4
        with:
          path: data/geocode-cache.json
          key: geocode-cache-${{ github.run_id }}
          restore-keys: geocode-cache-

      - name: Test pipeline
        run: npx vitest run __tests__/pipeline.test.ts __tests__/lib.test.ts

      - name: Build tilsyndata
        run: npm run build:data

      - name: Build prediksjon
        # Feiler modellen, skal tilsyndataene likevel oppdateres (siden viser datoen for prediksjonene).
        continue-on-error: true
        run: npm run build:prediksjon

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/steder.json generated/prediksjon.json public/data/kart.json public/tilsyn.geojson public/tilsyn-diff.json public/tilsyn-meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update tilsyndata $(date -u +%Y-%m-%d)"
            git push
          fi

      # Smilefjesvarsler på e-post (se docs/varsling.md). Hopper over uten secrets.
      # continue-on-error: en feil her skal ikke stoppe resten av jobben; den vises som en annotasjon.
      - name: Send smilefjesvarsler
        continue-on-error: true
        timeout-minutes: 30
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VARSLING_SECRET: ${{ secrets.VARSLING_SECRET }}
          VARSLING_FRA: ${{ secrets.VARSLING_FRA }}
          NEXT_PUBLIC_SITE_URL: https://smilefjeskartet.no
        run: npm run send:varsler
